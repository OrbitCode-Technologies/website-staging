name: Refresh PR previews

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: staging-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh static previews
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/refresh.py
      - name: Save preview files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          actor_id=$(gh api "users/$GITHUB_ACTOR" --jq .id)
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$actor_id+$GITHUB_ACTOR@users.noreply.github.com"
          git add public .preview-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh website previews"
            git push origin HEAD:main
          fi
      - name: Package preview site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish staging Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
